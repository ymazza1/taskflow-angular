<div class="board">
  <header class="board-header">
    <div class="header-content">
      <h1 i18n="Page title|Title of the board@@boardTitle">Flot de tache</h1>
      <span class="task-count" i18n>{totalTasks(), plural,
        =0 {Pas de tache}
        =1 {Une tache}
        other {{{totalTasks()}} taches}
      }</span>
    </div>
    <div class="header-actions">
      <div class="completion-badge">
        <span>{{ completedPercentage() }}% complété</span>
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="completedPercentage()"></div>
        </div>
      </div>
      <button class="btn-primary" (click)="showTaskForm.set(true)">+ Nouvelle tâche</button>
    </div>
  </header>

  <div class="board-columns">
    @for (column of columns; track column.id) {
      <app-column [column]="column" [tasks]="getTasksByColumnId(column.id)()" />
    }
  </div>

  @if (showTaskForm()) {
    <app-task-form
      [columns]="columns"
      (cancelled)="showTaskForm.set(false)"
      (createdTask)="onCreatedTask($event)"
    />
  }
</div>

<router-outlet />
