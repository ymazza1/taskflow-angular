<div class="detail-page">
  <header class="detail-header">
    <a class="btn-back" (click)="goBack()"> &#8592; Retour au board </a>
    <span class="task-id">Tâche #</span>
  </header>
  @if (task(); as task) {
    <article class="task-detail-card">
      <div class="card-top">
        <span class="column-badge">{{ task.columnId }}</span>
        <div class="field">
          <label class="field-label" for="task-title">Titre</label>
          <input
            id="task-title"
            class="field-input"
            type="text"
            [(ngModel)]="editedTitle"
            (ngModelChange)="markAsChanged()"
          />
        </div>
      </div>

      <section class="card-section">
        <div class="field">
          <label class="field-label" for="task-description">Description</label>
          <textarea
            id="task-description"
            class="field-input field-textarea"
            rows="4"
            [(ngModel)]="editedDescription"
            (ngModelChange)="markAsChanged()"
          ></textarea>
        </div>
      </section>

      <footer class="card-footer">
        <time class="date">Créée le </time>
        <div class="footer-actions">
          <button class="btn-delete">Supprimer</button>
          <button class="btn-save" (click)="save()">Sauvegarder</button>
        </div>
      </footer>
    </article>
  } @else {
    <div class="empty-state">
      <p class="empty-message">Aucune tâche chargée.</p>
    </div>
  }
</div>
